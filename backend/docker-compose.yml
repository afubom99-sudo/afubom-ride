services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bamenda_bikes
      POSTGRES_USER: bamenda
      POSTGRES_PASSWORD: local-development-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bamenda:local-development-password@db:5432/bamenda_bikes
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
